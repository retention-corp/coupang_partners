name: agent-ops-check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  public-agent-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Closed-loop public check
        env:
          OPENCLAW_SHOPPING_CLIENT_ID: github-actions-agent-ops
          OPENCLAW_SHOPPING_SURFACE: cli
        run: python3 scripts/agent_closed_loop.py
